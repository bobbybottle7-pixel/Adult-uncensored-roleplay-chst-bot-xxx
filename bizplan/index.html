<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VentureForge — AI business plans with a real financial model</title>
<meta name="description" content="Generate investor-grade business plans where the financials are computed by a deterministic engine, not written by a language model. Runs entirely in your browser.">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><text x='16' y='23' font-size='19' font-family='system-ui,sans-serif' font-weight='700' fill='white' text-anchor='middle'>V</text></svg>">
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="btn btn-icon btn-ghost rail-toggle" data-act="toggle-rail" aria-label="Menu">☰</button>
    <div class="brand" data-act="home" role="button" tabindex="0" style="cursor:pointer">
      <span class="brand-mark" aria-hidden="true">V</span>
      <span class="brand-name">VentureForge</span>
    </div>
    <span class="brand-tag">The numbers are computed, not written</span>
    <div class="topbar-spacer"></div>
    <span class="topbar-title" id="topbar-title"></span>
    <button class="btn btn-sm btn-ghost" data-act="theme" aria-label="Change theme" title="Change theme">◐</button>
    <button class="btn btn-sm" data-act="settings">Settings</button>
  </header>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="Navigation"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<noscript>
  <p style="padding:32px;max-width:40rem;margin:0 auto">
    VentureForge runs entirely in your browser, so it needs JavaScript enabled.
    Nothing is sent to a server — that is the point — but it does mean the app
    itself is the JavaScript.
  </p>
</noscript>

<!-- Load order matters: each module attaches to window.BP and the later ones
     read config and helpers from the earlier ones. -->
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/finance.js"></script>
<script src="js/score.js"></script>
<script src="js/charts.js"></script>
<script src="js/render.js"></script>
<script src="js/prompts.js"></script>
<script src="js/generate.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
<script>BP.App.boot();</script>

</body>
</html>
